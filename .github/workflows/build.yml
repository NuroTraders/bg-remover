name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup AI Models (Fast & Runtime)
        run: npm run setup

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (node -p "require('./package.json').version").Trim()
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($tagVersion -ne $packageVersion) {
            throw "Release tag v$tagVersion does not match package.json version $packageVersion"
          }

      - name: Build Windows EXE
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for auto-updater manifest generation

      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $smoke = Start-Process -FilePath "dist/win-unpacked/BG Remover.exe" -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if ($smoke.ExitCode -ne 0) { throw "Packaged app smoke test failed with exit code $($smoke.ExitCode)" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
